# Font settings
font_family      Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Cursor customization
cursor_shape     block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines 10000
scrollback_pager less +G -R

# Mouse
mouse_hide_wait  3.0
url_color        #89b4fa
url_style        dotted

# Window layout
window_padding_width 5
placement_strategy center
hide_window_decorations no
confirm_os_window_close 0

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# Color scheme - Catppuccin Mocha
foreground       #cdd6f4
background       #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0dc

# Black
color0   #45475a
color8   #585b70

# Red
color1   #f38ba8
color9   #f38ba8

# Green
color2   #a6e3a1
color10  #a6e3a1

# Yellow
color3   #f9e2af
color11  #f9e2af

# Blue
color4   #89b4fa
color12  #89b4fa

# Magenta
color5   #f5c2e7
color13  #f5c2e7

# Cyan
color6   #94e2d5
color14  #94e2d5

# White
color7   #cdd6f4
color15  #f5e0dc

# Advanced
shell_integration enabled
allow_remote_control yes
listen_on unix:/tmp/kitty

# Clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Performance
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# Terminal bell
enable_audio_bell no

# Keyboard shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+plus change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+f5 load_config_file
map ctrl+shift+u kitten unicode_input
map ctrl+shift+f2 edit_config_file
map ctrl+shift+f3 edit_config_file
map ctrl+shift+f4 edit_config_file
map ctrl+shift+f6 edit_config_file
map ctrl+shift+f7 edit_config_file
map ctrl+shift+f8 edit_config_file
map ctrl+shift+f9 edit_config_file
map ctrl+shift+f10 edit_config_file
map ctrl+shift+f11 edit_config_file
map ctrl+shift+f12 edit_config_file
map ctrl+shift+enter new_window
map ctrl+shift+n new_os_window
map ctrl+shift+w close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+f move_window_forward
map ctrl+shift+b move_window_backward
map ctrl+shift+` move_window_to_top
map ctrl+shift+1 first_window
map ctrl+shift+2 second_window
map ctrl+shift+3 third_window
map ctrl+shift+4 fourth_window
map ctrl+shift+5 fifth_window
map ctrl+shift+6 sixth_window
map ctrl+shift+7 seventh_window
map ctrl+shift+8 eighth_window
map ctrl+shift+9 ninth_window
map ctrl+shift+0 tenth_window
map ctrl+shift+r start_resizing_window
map ctrl+shift+z toggle_layout stack
map ctrl+shift+f next_layout
map ctrl+shift+space next_layout
map ctrl+shift+s toggle_layout stack
map ctrl+shift+f toggle_layout fullscreen
map ctrl+shift+up move_window up
map ctrl+shift+down move_window down
map ctrl+shift+left move_window left
map ctrl+shift+right move_window right
