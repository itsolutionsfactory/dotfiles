# Neofetch configuration for dotfiles
# Theme: acenoster
# See: https://github.com/chick2d/neofetch-themes/blob/main/normal/acenoster.conf

# Display
print_info() {
    info title
    info underline

    prin "┌─────────\n Hardware Information \n─────────┐"
    info "  OS" distro
    info "  Kernel" kernel
    info "  Uptime" uptime
    info "  Packages" packages
    info "  Shell" shell
    info "  Resolution" resolution
    info "  DE" de
    info "  WM" wm
    info "  Theme" theme
    info "  Icons" icons
    info "  Terminal" term
    info "  CPU" cpu
    info "  GPU" gpu
    info "  Memory" memory
    info "  Disk" disk
    prin "└─────────────────────────────────────┘"
}

# Display options
image_backend="ascii"
ascii_distro="auto"
ascii_colors=(distro)
ascii_bold="on"
gap=2

# Image options
image_source="auto"
image_size="auto"
image_loop="off"

# Text options
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"
block_range=(0 15)
color_blocks="on"
block_width=3
block_height=1
col_offset="auto"
bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=15
bar_color_elapsed="distro"
bar_color_total="distro"

# Info options
kernel_shorthand="on"
distro_shorthand="off"
os_arch="off"
uptime_shorthand="on"
memory_percent="on"
memory_unit="gib"
package_managers="on"
shell_path="off"
shell_version="on"
speed_type="bios_limit"
speed_shorthand="off"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
refresh_rate="off"
gtk_shorthand="on"
gtk2="on"
gtk3="on"
public_ip_host="http://ident.me"
public_ip_timeout=2
disk_show=('/')
disk_subtitle="mount"
disk_percent="on"
music_player="auto"
song_format="%artist% - %album% - %title%"
song_shorthand="off"
mpc_args=() 